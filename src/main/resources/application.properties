spring.application.name=qrcode.generator

# Endereço que a APLICAÇÃO usa para falar com o storage
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
# Endereço que o NAVEGADOR usa para abrir a imagem (entra na URL gerada)
storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
storage.region=us-east-1
storage.access-key=${STORAGE_ACESS_KEY:qrcode-admin}
storage.secret-key=${STORAGE_SECRET_KEY:troque-a-senha}
storage.bucket=qrcode
# Tempo de validade do link da imagem, em minutos (7 dias)
storage.url-expiration-minutes=10080